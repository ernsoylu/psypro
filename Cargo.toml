[workspace]
members = ["crates/psychro-core", "crates/psychro-wasm"]
resolver = "2"
# frees-wasm is a submodule with its own Cargo workspace. Without this, our root
# claims its crates and their `workspace = true` inheritance resolves against the
# wrong manifest.
exclude = ["vendor/frees-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ernsoylu/psypro"
authors = ["Eren SOYLU"]

[workspace.lints.rust]
missing_docs = "warn"

[profile.release]
# WASM payload size matters more than compile time for a static-hosted app.
opt-level = "s"
lto = true
codegen-units = 1
