[workspace]
members = ["crates/psychro-core", "crates/psychro-wasm"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ernsoylu/psypro"
authors = ["Eren SOYLU"]

[workspace.lints.rust]
missing_docs = "warn"

[profile.release]
# WASM payload size matters more than compile time for a static-hosted app.
opt-level = "s"
lto = true
codegen-units = 1
