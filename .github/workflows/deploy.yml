name: Deploy to GitHub Pages

# Pages publishes what main contains, nothing else: the workflow runs only when
# a pull request lands on main, never on feature branches or on demand.
on:
  push:
    branches: [main]

# One deployment at a time; never cancel a publish that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Rust toolchain
        run: rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # Pin explicitly: the action's "latest" resolves to v0.9.1, which predates
      # Cargo workspace inheritance and cannot parse `license.workspace = true`.
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'v0.15.0'

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      # wasm + typecheck + vite in one script; the WASM package is gitignored
      # and generated, so it must exist before anything typechecks against it.
      - name: Build WASM package and bundle
        working-directory: web
        run: npm run build

      # vite.config.ts sets base './', so the bundle works from the Pages
      # project subpath without a Pages-specific rebuild.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
