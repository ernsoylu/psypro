name: Deploy to GitHub Pages

# Pages publishes what main contains, nothing else: the workflow runs only when
# a pull request lands on main, never on feature branches or on demand.
on:
  push:
    branches: [main]

# One deployment at a time; never cancel a publish that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

# Permissions sit on the jobs, not the workflow: each job carries only what it
# needs, so a compromised step in one cannot spend the other's grants.
jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Rust toolchain
        run: rustup target add wasm32-unknown-unknown

      # Pinned to a full SHA (v2), same as CI.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      # Pin explicitly: the action's "latest" resolves to v0.9.1, which predates
      # Cargo workspace inheritance and cannot parse `license.workspace = true`.
      # The action itself is pinned to a full SHA (v0.4.0).
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa
        with:
          version: 'v0.15.0'

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      # --ignore-scripts, as in CI: no dependency needs a lifecycle script on
      # Linux, so skipping them removes an arbitrary-execution surface.
      - name: Install dependencies
        working-directory: web
        run: npm ci --ignore-scripts

      # wasm + typecheck + vite in one script; the WASM package is gitignored
      # and generated, so it must exist before anything typechecks against it.
      - name: Build WASM package and bundle
        working-directory: web
        run: npm run build

      # vite.config.ts sets base './', so the bundle works from the Pages
      # project subpath without a Pages-specific rebuild.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
