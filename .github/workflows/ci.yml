name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch — PR iteration is the common case.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust — format, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Rust toolchain
        run: rustup component add rustfmt clippy

      # Pinned to a full SHA (v2): supply-chain hygiene, and the quality gate
      # rejects anything less.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  web:
    name: Web — build WASM, typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Rust toolchain
        run: rustup target add wasm32-unknown-unknown

      # Pinned to a full SHA (v2), same as the rust job.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      # Pin explicitly: the action's "latest" resolves to v0.9.1, which predates
      # Cargo workspace inheritance and cannot parse `license.workspace = true`.
      # The action itself is pinned to a full SHA (v0.4.0).
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa
        with:
          version: 'v0.15.0'

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      # --ignore-scripts: no dependency needs a lifecycle script on Linux
      # (fsevents is the only one, and it is macOS-only), so skipping them
      # removes an arbitrary-execution surface from the install.
      - name: Install dependencies
        working-directory: web
        run: npm ci --ignore-scripts

      # The WASM package is gitignored and generated, so it must be built before
      # anything can typecheck against its generated .d.ts.
      - name: Build WASM package
        working-directory: web
        run: npm run wasm

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Test
        working-directory: web
        run: npm run test

      - name: Build
        working-directory: web
        run: npm run bundle
