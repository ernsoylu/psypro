server {
    listen 80;

    # Required: the image compiles nginx with --prefix=/etc/nginx, so without an
    # explicit root the implicit one is /etc/nginx/html, not the COPY target.
    root /usr/share/nginx/html;

    # The app is entirely client-side — there is no backend to proxy to.
    # Deep links and reloads simply re-enter the single-page app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
